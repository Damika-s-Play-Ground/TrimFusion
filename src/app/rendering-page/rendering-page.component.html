<div class="wrapper">
  <div class="content-wrapper">
    <div class="content-header">
      <div class="container">
        <div class="row mb-2">
          <div class="col-sm-8">
            <h1 class="m-0">
              TrimFusion <small>- Youtube Video Trimmer</small>
            </h1>
          </div>
          <div class="col-sm-4">
            <ol class="breadcrumb float-lg-right">
              <li class="active">HOME</li>
            </ol>
          </div>
        </div>
        <!-- /.row -->
      </div>
      <!-- /.container-fluid -->
    </div>
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-body">
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control rounded-0"
                  placeholder="Enter YouTube URL"
                  [(ngModel)]="youtubeUrl"
                />
                <span class="input-group-append">
                  <button
                    mat-flat-button
                    color="warn"
                    type="button"
                    class="btn btn-success btn-flat"
                    (click)="loadVideo()"
                  >
                    Load Video
                  </button>
                </span>
              </div>
              <div class="upload-group mb-3">
                <label for="localVideo" class="form-label d-block mb-1">
                  …or upload your own video
                </label>
                <input
                  id="localVideo"
                  type="file"
                  class="form-control"
                  accept="video/*"
                  (change)="onFileSelected($event)"
                  aria-label="Upload your own video"
                />
                <small *ngIf="localFileName" class="text-muted">
                  Loaded: {{ localFileName }}
                </small>
              </div>
              <div
                *ngIf="errorMessage"
                class="alert alert-danger py-2"
                role="alert"
                aria-live="polite"
              >
                {{ errorMessage }}
              </div>
              <div class="video-container">
                <video
                  *ngIf="localVideoUrl"
                  #localVid
                  [src]="localVideoUrl"
                  controls
                  width="560"
                  class="local-video-preview"
                  (loadedmetadata)="onLocalMetadata(localVid)"
                ></video>
                <iframe
                  *ngIf="embedUrl && !localVideoUrl"
                  width="560"
                  height="315"
                  [src]="sanitizedUrl"
                  title="YouTube video player"
                  allow="
                    accelerometer;
                    autoplay;
                    clipboard-write;
                    encrypted-media;
                    gyroscope;
                    picture-in-picture;
                    web-share;
                  "
                  allowfullscreen
                ></iframe>
                <img
                  *ngIf="!embedUrl && !localVideoUrl"
                  src="assets/default-video-thumbnail.jpg"
                  alt="placeholder"
                  class="default-video-thumbnail"
                />
              </div>
              <div class="timeline-container">
                <div class="input-group mb-3">
                  <div class="input-group-prepend">
                    <button type="button" class="btn btn-warning">start</button>
                  </div>
                  <!-- /btn-group -->
                  <input
                    type="text"
                    class="form-control"
                    [value]="formatTime(startSeconds)"
                    aria-label="Trim start time"
                    disabled
                  />
                </div>
                <div class="main-slider">
                  <mat-slider
                    [min]="0"
                    [max]="maxSeconds"
                    step="1"
                    [displayWith]="formatTime"
                    discrete
                  >
                    <input
                      matSliderStartThumb
                      [(ngModel)]="startSeconds"
                      (dragEnd)="onRangeChange()"
                      aria-label="Trim start"
                    />
                    <input
                      matSliderEndThumb
                      [(ngModel)]="endSeconds"
                      (dragEnd)="onRangeChange()"
                      aria-label="Trim end"
                    />
                  </mat-slider>
                </div>
                <div class="input-group mb-3">
                  <input
                    type="text"
                    class="form-control"
                    [value]="formatTime(endSeconds)"
                    aria-label="Trim end time"
                    disabled
                  />
                  <span class="input-group-append">
                    <button type="button" class="btn btn-success btn-flat">
                      end
                    </button>
                  </span>
                </div>
              </div>

              <!-- Local upload: real client-side trim + download -->
              <ng-container *ngIf="localVideoUrl">
                <button
                  mat-flat-button
                  color="warn"
                  (click)="trimAndDownload()"
                  [disabled]="trimming"
                  class="crop-button"
                >
                  <mat-icon>content_cut</mat-icon>
                  {{ trimming ? 'TRIMMING…' : 'TRIM & DOWNLOAD' }}
                </button>
                <div
                  *ngIf="trimming"
                  class="progress mt-2"
                  role="progressbar"
                  aria-label="Trimming progress"
                  [attr.aria-valuenow]="trimProgress"
                  aria-valuemin="0"
                  aria-valuemax="100"
                >
                  <div
                    class="progress-bar progress-bar-striped progress-bar-animated"
                    [style.width.%]="trimProgress"
                  >
                    {{ trimProgress }}%
                  </div>
                </div>
                <div
                  *ngIf="trimError"
                  class="alert alert-danger py-2 mt-2"
                  role="alert"
                  aria-live="polite"
                >
                  {{ trimError }}
                </div>
              </ng-container>

              <!-- YouTube: preview only (no client-side trim yet) -->
              <button
                *ngIf="!localVideoUrl"
                mat-flat-button
                color="warn"
                (click)="cropVideo()"
                [disabled]="!videoId"
                class="crop-button"
                title="Client-side trimming works for uploaded files. For a YouTube link, this opens the source video on YouTube."
              >
                <mat-icon>open_in_new</mat-icon>
                OPEN ON YOUTUBE
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
