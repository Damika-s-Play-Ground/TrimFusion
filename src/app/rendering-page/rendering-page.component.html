<div class="wrapper">
  <div class="content-wrapper">
    <div class="content-header">
      <div class="container">
        <div class="row mb-2">
          <div class="col-sm-8">
            <h1 class="m-0">
              TrimFusion
              <small
                >Trim, crop &amp; convert video — right in your browser</small
              >
            </h1>
          </div>
          <div class="col-sm-4 tf-header-actions">
            <button
              type="button"
              class="tf-theme-toggle"
              (click)="toggleTheme()"
              [attr.aria-label]="
                theme === 'dark'
                  ? 'Switch to light mode'
                  : 'Switch to dark mode'
              "
              [attr.aria-pressed]="theme === 'light'"
            >
              {{ theme === 'dark' ? '☀️ Light' : '🌙 Dark' }}
            </button>
          </div>
        </div>
        <!-- /.row -->
      </div>
      <!-- /.container-fluid -->
    </div>
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-body">
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control rounded-0"
                  placeholder="Enter YouTube URL"
                  [(ngModel)]="youtubeUrl"
                />
                <span class="input-group-append">
                  <button
                    mat-flat-button
                    color="warn"
                    type="button"
                    class="btn btn-success btn-flat"
                    (click)="loadVideo()"
                  >
                    Load Video
                  </button>
                </span>
              </div>
              <div class="upload-group mb-3">
                <label for="localVideo" class="form-label d-block mb-1">
                  …or upload your own video
                </label>
                <input
                  id="localVideo"
                  type="file"
                  class="form-control"
                  accept="video/*"
                  (change)="onFileSelected($event)"
                  aria-label="Upload your own video"
                />
                <small *ngIf="localFileName" class="text-muted">
                  Loaded: {{ localFileName }}
                </small>
              </div>
              <div
                *ngIf="errorMessage"
                class="alert alert-danger py-2"
                role="alert"
                aria-live="polite"
              >
                {{ errorMessage }}
              </div>
              <div class="video-container">
                <video
                  *ngIf="localVideoUrl"
                  #localVid
                  [src]="localVideoUrl"
                  controls
                  width="560"
                  class="local-video-preview"
                  (loadedmetadata)="onLocalMetadata(localVid)"
                ></video>
                <iframe
                  *ngIf="embedUrl && !localVideoUrl"
                  width="560"
                  height="315"
                  [src]="sanitizedUrl"
                  title="YouTube video player"
                  allow="
                    accelerometer;
                    autoplay;
                    clipboard-write;
                    encrypted-media;
                    gyroscope;
                    picture-in-picture;
                    web-share;
                  "
                  allowfullscreen
                ></iframe>
                <img
                  *ngIf="!embedUrl && !localVideoUrl"
                  src="assets/default-video-thumbnail.jpg"
                  alt="placeholder"
                  class="default-video-thumbnail"
                />
              </div>
              <div class="timeline-container">
                <div class="input-group mb-3">
                  <div class="input-group-prepend">
                    <button type="button" class="btn btn-warning">start</button>
                  </div>
                  <!-- /btn-group -->
                  <input
                    type="text"
                    class="form-control"
                    [value]="formatTime(startSeconds)"
                    aria-label="Trim start time"
                    disabled
                  />
                </div>
                <div class="main-slider">
                  <mat-slider
                    [min]="0"
                    [max]="maxSeconds"
                    step="1"
                    [displayWith]="formatTime"
                    discrete
                  >
                    <input
                      matSliderStartThumb
                      [(ngModel)]="startSeconds"
                      (dragEnd)="onRangeChange()"
                      aria-label="Trim start"
                    />
                    <input
                      matSliderEndThumb
                      [(ngModel)]="endSeconds"
                      (dragEnd)="onRangeChange()"
                      aria-label="Trim end"
                    />
                  </mat-slider>
                </div>
                <div class="input-group mb-3">
                  <input
                    type="text"
                    class="form-control"
                    [value]="formatTime(endSeconds)"
                    aria-label="Trim end time"
                    disabled
                  />
                  <span class="input-group-append">
                    <button type="button" class="btn btn-success btn-flat">
                      end
                    </button>
                  </span>
                </div>
              </div>

              <!-- Local upload: real client-side trim + download -->
              <ng-container *ngIf="localVideoUrl">
                <div class="export-group mb-2">
                  <label for="outputSelect" class="form-label d-block mb-1">
                    Export as
                  </label>
                  <select
                    id="outputSelect"
                    class="form-select"
                    [(ngModel)]="selectedOutput"
                    [disabled]="trimming"
                    aria-label="Export format"
                  >
                    <option
                      *ngFor="let fmt of outputFormats"
                      [ngValue]="fmt.value"
                    >
                      {{ fmt.label }}
                    </option>
                  </select>
                </div>
                <div class="aspect-group mb-2">
                  <label for="aspectSelect" class="form-label d-block mb-1">
                    Crop to display size
                  </label>
                  <select
                    id="aspectSelect"
                    class="form-select"
                    [(ngModel)]="selectedAspect"
                    [disabled]="trimming || selectedOutput === 'audio'"
                    aria-label="Crop to display size"
                  >
                    <option
                      *ngFor="let preset of aspectPresets"
                      [ngValue]="preset.value"
                    >
                      {{ preset.label }}
                    </option>
                  </select>
                </div>
                <div class="rotate-group mb-2">
                  <label for="rotateSelect" class="form-label d-block mb-1">
                    Rotate / flip
                  </label>
                  <select
                    id="rotateSelect"
                    class="form-select"
                    [(ngModel)]="selectedRotate"
                    [disabled]="trimming || selectedOutput === 'audio'"
                    aria-label="Rotate or flip video"
                  >
                    <option *ngFor="let r of rotatePresets" [ngValue]="r.value">
                      {{ r.label }}
                    </option>
                  </select>
                </div>
                <div
                  class="color-group mb-2"
                  *ngIf="selectedOutput !== 'audio'"
                >
                  <label for="brightnessRange" class="form-label d-block mb-1">
                    Brightness ({{ brightness }})
                  </label>
                  <input
                    id="brightnessRange"
                    type="range"
                    class="form-range"
                    min="-0.5"
                    max="0.5"
                    step="0.05"
                    [ngModel]="brightness"
                    (ngModelChange)="brightness = +$event"
                    [disabled]="trimming"
                  />
                  <label for="contrastRange" class="form-label d-block mb-1">
                    Contrast ({{ contrast }})
                  </label>
                  <input
                    id="contrastRange"
                    type="range"
                    class="form-range"
                    min="0.5"
                    max="2"
                    step="0.05"
                    [ngModel]="contrast"
                    (ngModelChange)="contrast = +$event"
                    [disabled]="trimming"
                  />
                  <label for="saturationRange" class="form-label d-block mb-1">
                    Saturation ({{ saturation }})
                  </label>
                  <input
                    id="saturationRange"
                    type="range"
                    class="form-range"
                    min="0"
                    max="3"
                    step="0.1"
                    [ngModel]="saturation"
                    (ngModelChange)="saturation = +$event"
                    [disabled]="trimming"
                  />
                  <button
                    type="button"
                    class="btn btn-sm btn-outline-secondary"
                    *ngIf="colorsChanged"
                    (click)="resetColors()"
                    [disabled]="trimming"
                  >
                    Reset colors
                  </button>
                </div>
                <div class="volume-group mb-2" *ngIf="selectedOutput !== 'gif'">
                  <label for="volumeRange" class="form-label d-block mb-1">
                    Volume ({{ volumePercent }}%)
                  </label>
                  <input
                    id="volumeRange"
                    type="range"
                    class="form-range"
                    min="0"
                    max="2"
                    step="0.05"
                    [ngModel]="volumeGain"
                    (ngModelChange)="volumeGain = +$event"
                    [disabled]="
                      trimming || (selectedOutput === 'video' && muteAudio)
                    "
                  />
                </div>
                <div
                  class="scale-group mb-2"
                  *ngIf="selectedOutput === 'video'"
                >
                  <label for="scaleSelect" class="form-label d-block mb-1">
                    Resolution
                  </label>
                  <select
                    id="scaleSelect"
                    class="form-select"
                    [(ngModel)]="selectedScale"
                    [disabled]="trimming"
                    aria-label="Output resolution"
                  >
                    <option *ngFor="let s of scalePresets" [ngValue]="s.value">
                      {{ s.label }}
                    </option>
                  </select>
                </div>
                <div
                  class="speed-group mb-2"
                  *ngIf="selectedOutput === 'video'"
                >
                  <label for="speedSelect" class="form-label d-block mb-1">
                    Playback speed
                  </label>
                  <select
                    id="speedSelect"
                    class="form-select"
                    [(ngModel)]="selectedSpeed"
                    [disabled]="trimming"
                    aria-label="Playback speed"
                  >
                    <option *ngFor="let s of speedPresets" [ngValue]="s.value">
                      {{ s.label }}
                    </option>
                  </select>
                </div>
                <div
                  class="mute-group form-check mb-2"
                  *ngIf="selectedOutput === 'video'"
                >
                  <input
                    id="muteCheck"
                    type="checkbox"
                    class="form-check-input"
                    [(ngModel)]="muteAudio"
                    [disabled]="trimming"
                  />
                  <label for="muteCheck" class="form-check-label">
                    Remove audio (mute)
                  </label>
                </div>
                <div
                  class="precise-group form-check mb-2"
                  *ngIf="selectedOutput === 'video'"
                >
                  <input
                    id="preciseCheck"
                    type="checkbox"
                    class="form-check-input"
                    [(ngModel)]="preciseCut"
                    [disabled]="trimming"
                  />
                  <label for="preciseCheck" class="form-check-label">
                    Precise cut (frame-accurate, slower)
                  </label>
                </div>
                <button
                  mat-flat-button
                  color="warn"
                  (click)="trimAndDownload()"
                  [disabled]="trimming"
                  class="crop-button"
                >
                  <mat-icon>content_cut</mat-icon>
                  {{ trimming ? 'TRIMMING…' : 'TRIM & DOWNLOAD' }}
                </button>
                <button
                  type="button"
                  class="crop-button crop-button--ghost"
                  (click)="grabFrame()"
                  [disabled]="trimming"
                  title="Save the frame currently shown in the player as a PNG"
                >
                  <mat-icon>photo_camera</mat-icon>
                  GRAB CURRENT FRAME (PNG)
                </button>
                <div
                  *ngIf="trimming"
                  class="progress mt-2"
                  role="progressbar"
                  aria-label="Trimming progress"
                  [attr.aria-valuenow]="trimProgress"
                  aria-valuemin="0"
                  aria-valuemax="100"
                >
                  <div
                    class="progress-bar progress-bar-striped progress-bar-animated"
                    [style.width.%]="trimProgress"
                  >
                    {{ trimProgress }}%
                  </div>
                </div>
                <div
                  *ngIf="trimError"
                  class="alert alert-danger py-2 mt-2"
                  role="alert"
                  aria-live="polite"
                >
                  {{ trimError }}
                </div>
              </ng-container>

              <!-- YouTube: preview only (no client-side trim yet) -->
              <button
                *ngIf="!localVideoUrl"
                mat-flat-button
                color="warn"
                (click)="cropVideo()"
                [disabled]="!videoId"
                class="crop-button"
                title="Client-side trimming works for uploaded files. For a YouTube link, this opens the source video on YouTube."
              >
                <mat-icon>open_in_new</mat-icon>
                OPEN ON YOUTUBE
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
