<div
  class="strip-viewport"
  role="group"
  tabindex="0"
  aria-label="Timeline — click to move the playhead, arrow keys to step it"
  (click)="onTrackClick($event)"
  (keydown)="onTrackKeydown($event)"
>
  <div
    class="strip-track"
    [style.width.%]="zoom * 100"
    [style.transform]="stripTransform"
  >
    <div
      class="filmstrip"
      *ngIf="filmstripLoading || filmstrip.length"
      aria-hidden="true"
    >
      <ng-container *ngIf="filmstripLoading; else strip">
        <span class="skeleton-cell" *ngFor="let cell of skeletonCells"></span>
      </ng-container>
      <ng-template #strip>
        <img *ngFor="let frame of filmstrip" [src]="frame" alt="" />
      </ng-template>
    </div>
    <canvas
      #waveCanvas
      class="waveform"
      *ngIf="waveform?.length"
      aria-hidden="true"
    ></canvas>
  </div>
  <div class="track-overlay" aria-hidden="true">
    <div
      class="marker marker-in"
      *ngIf="posPercent(start) !== null"
      [style.left.%]="posPercent(start)"
    ></div>
    <div
      class="marker marker-out"
      *ngIf="posPercent(end) !== null"
      [style.left.%]="posPercent(end)"
    ></div>
    <div
      class="marker marker-playhead"
      *ngIf="playhead !== null && posPercent(playhead) !== null"
      [style.left.%]="posPercent(playhead)"
    ></div>
  </div>
</div>
<div class="segment-lane" *ngIf="segments.length">
  <ng-container *ngFor="let seg of segments; let i = index">
    <button
      *ngIf="blockStyle(seg) as style"
      type="button"
      class="segment-block"
      [class.selected]="selectedSegment === i"
      [style.left.%]="style.left"
      [style.width.%]="style.width"
      (click)="onBlockClick(i)"
      (pointerdown)="onBlockPointerDown($event, i)"
      (pointermove)="onBlockPointerMove($event)"
      (pointerup)="onBlockPointerUp()"
      (pointercancel)="onBlockPointerUp()"
      [attr.aria-label]="
        'Segment ' +
        (i + 1) +
        ': ' +
        formatTime(seg.start) +
        ' to ' +
        formatTime(seg.end)
      "
      [attr.aria-pressed]="selectedSegment === i"
    >
      {{ i + 1 }}
    </button>
  </ng-container>
</div>
<div class="zoom-row">
  <span class="zoom-label">Zoom</span>
  <button
    *ngFor="let level of zoomLevels"
    type="button"
    class="zoom-btn"
    [class.active]="zoom === level"
    (click)="setZoom(level)"
    [attr.aria-pressed]="zoom === level"
    [attr.aria-label]="'Zoom ' + level + 'x'"
  >
    {{ level }}×
  </button>
  <button
    type="button"
    class="zoom-btn"
    (click)="pan(-1)"
    [disabled]="zoom === 1"
    aria-label="Pan timeline earlier"
  >
    ‹
  </button>
  <button
    type="button"
    class="zoom-btn"
    (click)="pan(1)"
    [disabled]="zoom === 1"
    aria-label="Pan timeline later"
  >
    ›
  </button>
  <span class="zoom-window" *ngIf="zoom > 1">
    {{ formatTime(viewFrom) }} – {{ formatTime(viewTo) }}
  </span>
  <button
    type="button"
    class="zoom-btn"
    (click)="setIn.emit()"
    [disabled]="playhead === null"
    aria-label="Set trim start at the playhead"
  >
    ⇤ Set start here
  </button>
  <button
    type="button"
    class="zoom-btn"
    (click)="setOut.emit()"
    [disabled]="playhead === null"
    aria-label="Set trim end at the playhead"
  >
    Set end here ⇥
  </button>
  <label class="snap-toggle">
    <input type="checkbox" [(ngModel)]="snap" />
    Snap to seconds
  </label>
</div>
<div class="timeline-container">
  <div class="input-group mb-3">
    <div class="input-group-prepend">
      <button type="button" class="btn btn-warning">start</button>
    </div>
    <input
      type="text"
      class="form-control"
      [value]="formatTime(start)"
      aria-label="Trim start time"
      disabled
    />
  </div>
  <div class="main-slider">
    <mat-slider
      [min]="viewFrom"
      [max]="viewTo"
      [step]="step"
      [displayWith]="formatTime"
      discrete
    >
      <input
        matSliderStartThumb
        [ngModel]="start"
        (ngModelChange)="onStartModel($event)"
        (dragEnd)="rangeCommit.emit()"
        aria-label="Trim start"
      />
      <input
        matSliderEndThumb
        [ngModel]="end"
        (ngModelChange)="onEndModel($event)"
        (dragEnd)="rangeCommit.emit()"
        aria-label="Trim end"
      />
    </mat-slider>
  </div>
  <div class="input-group mb-3">
    <input
      type="text"
      class="form-control"
      [value]="formatTime(end)"
      aria-label="Trim end time"
      disabled
    />
    <span class="input-group-append">
      <button type="button" class="btn btn-success btn-flat">end</button>
    </span>
  </div>
</div>
