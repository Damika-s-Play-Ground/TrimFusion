version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular*'
    ignore:
      # Slated for REMOVAL in the Wave-6 bundle diet, not upgrade.
      - dependency-name: 'admin-lte'
        update-types: ['version-update:semver-major']
      # Angular majors need staged `ng update` migrations (tracked as a
      # dedicated program effort), not a bump PR.
      - dependency-name: '@angular*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
