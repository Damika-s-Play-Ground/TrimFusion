name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests (headless Chrome)
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Bundle size budget (initial <= 2.6 MB)
        run: |
          SIZE_KB=$(du -ck dist/trim-fusion/main*.js dist/trim-fusion/polyfills*.js dist/trim-fusion/runtime*.js dist/trim-fusion/styles*.css | tail -1 | cut -f1)
          echo "Initial bundle: ${SIZE_KB} KB (budget 2662 KB)"
          test "$SIZE_KB" -le 2662
